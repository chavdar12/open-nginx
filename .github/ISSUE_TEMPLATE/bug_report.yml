name: Bug report
description: A crash, a false warning, or something that does not work
labels: [bug]
body:
  - type: textarea
    id: config
    attributes:
      label: nginx config
      description: The smallest config that shows the problem.
      render: nginx
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: input
    id: ide
    attributes:
      label: IDE and version
      placeholder: IntelliJ IDEA 2026.2.4
    validations:
      required: true
  - type: input
    id: plugin
    attributes:
      label: Plugin version or commit
