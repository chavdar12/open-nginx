name: Code Quality

on:
  push:
    branches: [ main ]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  detekt:
    runs-on: ubuntu-latest
    env:
      DETEKT_VERSION: 1.23.8
      DETEKT_SHA256: 2ce2ff952e150baf28a29cda70a363b0340b3e81a55f43e51ec5edffc3d066c1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 25
      # The standalone CLI, not the Gradle plugin: detekt 1.23 is built against Kotlin 2.0 and this project uses 2.4.
      - name: Download detekt
        run: |
          curl -fsSL -o "$RUNNER_TEMP/detekt-cli.jar" \
            "https://github.com/detekt/detekt/releases/download/v$DETEKT_VERSION/detekt-cli-$DETEKT_VERSION-all.jar"
          echo "$DETEKT_SHA256  $RUNNER_TEMP/detekt-cli.jar" | sha256sum -c -
      # Any finding fails the job; findings that predate detekt are listed in config/detekt/baseline.xml.
      - name: Run detekt
        run: >
          java -jar "$RUNNER_TEMP/detekt-cli.jar" --build-upon-default-config
          --config config/detekt/detekt.yml --baseline config/detekt/baseline.xml
          --input src/main/kotlin,src/test/kotlin
          --base-path "$GITHUB_WORKSPACE" --report sarif:detekt.sarif
      # Shows findings inline on the PR and in the Security tab.
      - if: always() && hashFiles('detekt.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: detekt.sarif
          category: detekt

  codeql:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: manual
          - language: python # tools/ data generators
            build-mode: none
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        if: matrix.language == 'java-kotlin'
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        if: matrix.language == 'java-kotlin'
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-and-quality
      # CodeQL only sees Kotlin it watches being compiled: no daemon or cache, or nothing compiles in front of it.
      # The traced compiler runs inside Gradle's JVM, whose default 512 MB heap ran out (GC overhead limit exceeded).
      - if: matrix.build-mode == 'manual'
        run: >
          ./gradlew compileKotlin compileTestKotlin --no-daemon --no-build-cache --rerun-tasks
          -Dorg.gradle.jvmargs=-Xmx6g -Pkotlin.compiler.execution.strategy=in-process
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
