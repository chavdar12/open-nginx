name: Code Quality

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  codeql:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: manual
          - language: python # tools/ data generators
            build-mode: none
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v6
        if: matrix.language == 'java-kotlin'
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
        if: matrix.language == 'java-kotlin'
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-and-quality
      # CodeQL only sees Kotlin it watches being compiled: no daemon or cache, or nothing compiles in front of it.
      # The traced compiler runs inside Gradle's JVM, whose default 512 MB heap ran out (GC overhead limit exceeded).
      - if: matrix.build-mode == 'manual'
        run: >
          ./gradlew compileKotlin compileTestKotlin --no-daemon --no-build-cache --rerun-tasks
          -Dorg.gradle.jvmargs=-Xmx6g -Pkotlin.compiler.execution.strategy=in-process
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
