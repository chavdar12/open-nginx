


daemon off;

events {
    debug_connection unix:;
}

http {
    

    error_log /tmp/nginx-test/debug1.log alert;
    error_log /tmp/nginx-test/debug2.log alert;

    server {
        listen       127.0.0.1:8080;
        listen       unix:/tmp/nginx-test/unix.sock;
        server_name  localhost;

        location /debug {
            proxy_pass http://unix:/tmp/nginx-test/unix.sock:/;
        }
    }
}

