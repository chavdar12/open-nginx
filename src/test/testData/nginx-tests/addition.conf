


daemon off;

events {
}

http {
    

    server {
        listen       127.0.0.1:8080;
        server_name  localhost;

        location /regular {
            return 200 "body";
        }

        location /b.html {
            add_before_body /add_before;
            return 200 "body";
        }

        location /a.html {
            add_after_body /add_after;
            return 200 "body";
        }

        location /ba.html {
            add_before_body /add_before;
            add_after_body /add_after;
            return 200 "body";
        }

        location /notype {
            add_before_body /add_before;
            add_after_body /add_after;
            return 200 "body";
        }

        location /notype2 {
            addition_types text/plain;
            add_after_body /add_after;
            return 200 "body";
        }

        location /notype.html {
            types {}
            add_before_body /add_before;
            return 200 "body";
        }

        location /add_before {
            return 200 "before";
        }

        location /add_after {
            return 200 "after";
        }

        location /self.html {
            add_after_body /self.html;
            return 200 "self";
        }

        location /return202.html {
            add_after_body /add_after;
            return 202 "body";
        }
    }
}

