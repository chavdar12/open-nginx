


daemon off;

events {
}

http {
    

    server {
        listen       127.0.0.1:8080;
        server_name  localhost;

        location / {
            post_action /post.html;
        }

        location /post.html {
            # static
        }

        location /remote {
            post_action /post.remote;
        }

        location /post.remote {
            proxy_pass http://127.0.0.1:8080/post.html;
        }
    }
}

