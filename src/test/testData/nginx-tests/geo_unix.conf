


daemon off;

events {
}

http {
    

    geo $geo {
        default                  default;
        255.255.255.255          none;
    }

    geo $remote_addr $geora {
        default                  default;
        255.255.255.255          none;
    }

    geo $geor {
        ranges;
        0.0.0.0-255.255.255.254  test;
        default                  none;
    }

    geo $remote_addr $georra {
        ranges;
        0.0.0.0-255.255.255.254  test;
        default                  none;
    }

    geo $arg_ip $geo_arg {
        default                  default;
        192.0.2.0/24             test;
    }

    server {
        listen       unix:/tmp/nginx-test/unix.sock;
        server_name  localhost;

        location / {
            add_header X-Geo          $geo;
            add_header X-Addr         $geora;
            add_header X-Ranges       $geor;
            add_header X-Ranges-Addr  $georra;
            add_header X-Arg          $geo_arg;
        }
    }

    server {
        listen       127.0.0.1:8080;

        location / {
            proxy_pass http://unix:/tmp/nginx-test/unix.sock;
        }
    }
}

