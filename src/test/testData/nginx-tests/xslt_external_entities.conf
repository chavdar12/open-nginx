


daemon off;

events {
}

http {
    

    server {
        listen       127.0.0.1:8080;
        server_name  localhost;

        default_type text/xml;

        location /normal {
            xslt_stylesheet /tmp/nginx-test/identity.xslt;
        }

        location /entity_file {
            xslt_stylesheet /tmp/nginx-test/identity.xslt;
        }

        location /entity_allowed {
            xml_external_entities on;
            xslt_stylesheet /tmp/nginx-test/identity.xslt;
        }

        location /entity_net {
            xslt_stylesheet /tmp/nginx-test/identity.xslt;
        }

        location /predefined {
            xslt_stylesheet /tmp/nginx-test/identity.xslt;
        }
    }
}

