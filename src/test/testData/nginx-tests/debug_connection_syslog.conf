


daemon off;

events {
    debug_connection ::1;
}

http {
    

    error_log syslog:server=127.0.0.1:8981 alert;
    error_log syslog:server=127.0.0.1:8982 alert;

    server {
        listen       127.0.0.1:8080;
        listen       [::1]:8080;
        server_name  localhost;

        location /debug {
            proxy_pass http://[::1]:8080/;
        }
    }
}

