


daemon off;

events {
}

http {
    

    server {
        listen       127.0.0.1:8080;
        server_name  s1;

        location /on/ {
            disable_symlinks on;
        }

        location /not_owner/ {
            disable_symlinks if_not_owner;
        }

        location /try_on/ {
            disable_symlinks on;
            try_files $uri $uri.html =404;
        }

        location /try_not_owner/ {
            disable_symlinks if_not_owner;
            try_files $uri $uri.txt =404;
        }

        location /if_on/ {
            disable_symlinks on;
            if (-f $request_filename) {
                return 204;
            }
        }

        location /if_not_owner/ {
            disable_symlinks if_not_owner;
            if (-f $request_filename) {
                return 204;
            }
        }

        location /complex/1/ {
            disable_symlinks on;
            alias /tmp/nginx-test/./cached/../;
        }

        location /complex/2/ {
            disable_symlinks on;
            alias /tmp/nginx-test//./cached/..//;
        }

        location /complex/3/ {
            disable_symlinks on;
            alias ////tmp/nginx-test//./cached/..//;
        }

        location ~ (.+/)tail$ {
            disable_symlinks on;
            alias /tmp/nginx-test/$1;
        }

        location ~ (.+/)tailowner$ {
            disable_symlinks if_not_owner;
            alias /tmp/nginx-test/$1;
        }

        location ~ (.+/)tailoff$ {
            disable_symlinks off;
            alias /tmp/nginx-test/$1;
        }

        location /dir {
            disable_symlinks on;
            try_files $uri/ =404;
        }

        location /from {
            disable_symlinks on from=$document_root;

            location /from/wo_slash {
                alias /tmp/nginx-test/dirlink;
            }
            location /from/with_slash/ {
                alias /tmp/nginx-test/dirlink/;
            }
            location ~ ^/from/exact/(.+)$ {
                alias /tmp/nginx-test/$1;
            }
        }
    }

    server {
        listen       127.0.0.1:8080;
        server_name  s2;

        open_file_cache max=16 inactive=60s;
        open_file_cache_valid 30s;
        open_file_cache_min_uses 1;
        open_file_cache_errors on;

        location /cached-off/ {
            disable_symlinks off;
            alias /tmp/nginx-test/cached/;
        }

        location /cached-on/ {
            disable_symlinks on;
            alias /tmp/nginx-test/cached/;
        }

        location /cached-if-not-owner/ {
            disable_symlinks if_not_owner;
            alias /tmp/nginx-test/cached/;
        }

        location / {
            disable_symlinks off;
        }
    }
}

