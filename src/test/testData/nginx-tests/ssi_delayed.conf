


daemon off;

events {
}

http {
    

    server {
        listen       127.0.0.1:8080;
        server_name  localhost;

        location / { }
        location /delayed.html {
            ssi on;
            sendfile_max_chunk 100;
            postpone_output 0;
        }

        location /1 {
            proxy_buffers 3 256;
            proxy_buffer_size 256;
            proxy_max_temp_file_size 0;
            proxy_pass http://127.0.0.1:8081;
        }
    }
}

