


daemon off;

events {
}

http {
    

    ssl_certificate_key localhost.key;
    ssl_certificate localhost.crt;

    server {
        listen       127.0.0.1:8980 quic;
        listen       127.0.0.1:8080;
        server_name  localhost;

        http3_stream_buffer_size 64k;

        location / {
            proxy_pass http://127.0.0.1:8080/stub;
        }

        location /stub { }
    }
}

