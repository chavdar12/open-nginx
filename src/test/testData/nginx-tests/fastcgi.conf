


daemon off;

events {
}

http {
    

    upstream u {
        server 127.0.0.1:8081;
    }

    server {
        listen       127.0.0.1:8080;
        server_name  localhost;

        location / {
            fastcgi_pass 127.0.0.1:8081;
            fastcgi_param REQUEST_URI $request_uri;
        }

        location /catch {
            fastcgi_pass 127.0.0.1:8081;
            fastcgi_param REQUEST_URI "/stderr";
            fastcgi_catch_stderr sample;
        }

        location /var {
            fastcgi_pass $arg_b;
            fastcgi_param REQUEST_URI $request_uri;
        }
    }
}

