


daemon off;

events {
}

stream {
    

    proxy_requests           2;
    proxy_responses          1;
    proxy_timeout            3s;

    server {
        listen               127.0.0.1:8982 udp;
        proxy_pass           127.0.0.1:8980;
    }

    server {
        listen               127.0.0.1:8983 udp;
        proxy_pass           127.0.0.1:8980;
        proxy_download_rate  500;
    }

    server {
        listen               127.0.0.1:8984 udp;
        proxy_pass           127.0.0.1:8980;
        proxy_upload_rate    500;
    }
}

