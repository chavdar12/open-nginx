


daemon off;

events {
}

stream {
    

    limit_conn_zone  $binary_remote_addr$server_port  zone=zone:1m;

    server {
        listen      127.0.0.1:8080;
        proxy_pass  127.0.0.1:8084;
        limit_conn  zone 1;
    }

    server {
        listen      127.0.0.1:8081;
        proxy_pass  127.0.0.1:8084;
        limit_conn  zone 1;
    }
}

http {
    

    server {
        listen       127.0.0.1:8084;
        server_name  localhost;

        location / { }
    }
}

