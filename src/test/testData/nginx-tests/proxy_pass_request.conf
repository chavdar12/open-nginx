


daemon off;

events {
}

http {
    

    server {
        listen       127.0.0.1:8080;
        server_name  localhost;

        proxy_pass_request_headers off;

        location / {
            proxy_pass http://127.0.0.1:8081;
        }

        location /body {
            proxy_pass http://127.0.0.1:8081;
            proxy_pass_request_headers on;
            proxy_pass_request_body off;
        }

        location /both {
            proxy_pass http://127.0.0.1:8081;
            proxy_pass_request_headers off;
            proxy_pass_request_body off;
        }
    }
}

