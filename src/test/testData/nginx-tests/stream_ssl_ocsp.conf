


daemon off;

events {
}

stream {
    

    log_format test
        $ssl_server_name:$status:$ssl_client_verify:$ssl_session_reused;
    access_log /tmp/nginx-test/test.log test;

    ssl_ocsp leaf;
    ssl_verify_client on;
    ssl_verify_depth 2;
    ssl_client_certificate trusted.crt;

    ssl_certificate_key rsa.key;
    ssl_certificate rsa.crt;

    ssl_session_cache shared:SSL:1m;
    ssl_session_tickets on;

    server {
        listen       127.0.0.1:8443 ssl;
        server_name  localhost;
        return       "$ssl_client_verify:$ssl_session_reused";
    }

    server {
        listen       127.0.0.1:8443 ssl;
        server_name  sni;
        return       "$ssl_client_verify:$ssl_session_reused";

        ssl_ocsp_responder http://127.0.0.1:8082;
    }

    server {
        listen       127.0.0.1:8443 ssl;
        server_name  resolver;
        return       "$ssl_client_verify:$ssl_session_reused";

        ssl_ocsp on;
    }

    server {
        listen       127.0.0.1:8444 ssl;
        server_name  localhost;
        return       "$ssl_client_verify:$ssl_session_reused";

        ssl_ocsp_responder http://127.0.0.1:8081;
        ssl_ocsp on;
    }

    server {
        listen       127.0.0.1:8445 ssl;
        server_name  localhost;
        return       "$ssl_client_verify:$ssl_session_reused";

        ssl_ocsp_responder http://127.0.0.1:8083/test;
    }

    server {
        listen       127.0.0.1:8446 ssl;
        server_name  localhost;
        return       "$ssl_client_verify:$ssl_session_reused";

        ssl_ocsp_cache shared:OCSP:1m;
    }

    server {
        listen       127.0.0.1:8447 ssl;
        server_name  localhost;
        return       "$ssl_client_verify:$ssl_session_reused";

        ssl_ocsp_responder http://127.0.0.1:8082;
        ssl_client_certificate root.crt;
    }
}

