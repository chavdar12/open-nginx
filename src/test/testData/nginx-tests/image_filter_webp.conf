


daemon off;

events {
}

http {
    

    server {
        listen       127.0.0.1:8080;
        server_name  localhost;

        location /size {
            image_filter size;
            alias /tmp/nginx-test/;
        }

        location /test {
            image_filter test;
            alias /tmp/nginx-test/;
        }

        location /resize {
            image_filter resize 1 1;
            alias /tmp/nginx-test/;
        }

        location /quality {
            image_filter rotate 90;
            image_filter_webp_quality 50;
            alias /tmp/nginx-test/;
        }
        location /quality_var {
            image_filter rotate 90;
            image_filter_webp_quality $arg_q;
            alias /tmp/nginx-test/;
        }
    }
}

