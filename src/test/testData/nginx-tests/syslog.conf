


error_log syslog:server=127.0.0.1:8981 info;
error_log /tmp/nginx-test/f_glob.log info;

daemon off;

events {
}

http {
    

    limit_req_zone $binary_remote_addr zone=one:1m rate=1r/m;

    log_format empty "";
    log_format logf "$uri:$status";

    error_log syslog:server=127.0.0.1:8982 info;
    error_log /tmp/nginx-test/f_http.log info;

    server {
        listen       127.0.0.1:8080;
        server_name  localhost;

        location /e {
            error_log syslog:server=127.0.0.1:8984;
        }
        location /a {
            access_log syslog:server=127.0.0.1:8984;
        }
        location /ef {
            error_log syslog:server=127.0.0.1:8984,facility=user;
        }
        location /es {
            error_log syslog:server=127.0.0.1:8984,severity=alert;
        }
        location /et {
            error_log syslog:server=127.0.0.1:8984,tag=SEETHIS;
        }
        location /af {
            access_log syslog:server=127.0.0.1:8984,facility=user;
        }
        location /as {
            # put severity inside to catch possible parsing programming errors
            access_log syslog:severity=alert,server=127.0.0.1:8984;
        }
        location /at {
            access_log syslog:server=127.0.0.1:8984,tag=SEETHIS;
        }
        location /e2 {
            error_log syslog:server=127.0.0.1:8984;
            error_log syslog:server=127.0.0.1:8984;
        }
        location /a2 {
            access_log syslog:server=127.0.0.1:8984;
            access_log syslog:server=127.0.0.1:8984;
        }
        location /a_logf {
            access_log syslog:server=127.0.0.1:8984 logf;
        }
        location /if {
            access_log syslog:server=127.0.0.1:8983 logf
                if=$arg_logme;
        }

        location /nohostname {
            access_log syslog:server=127.0.0.1:8984,nohostname;
        }

        location /debug {
            limit_req zone=one;
            error_log syslog:server=127.0.0.1:8984 debug;
        }
        location /info {
            limit_req zone=one;
            limit_req_log_level info;
            error_log syslog:server=127.0.0.1:8984 info;
        }
        location /notice {
            limit_req zone=one;
            limit_req_log_level notice;
            error_log syslog:server=127.0.0.1:8984 notice;
        }
        location /warn {
            limit_req zone=one;
            limit_req_log_level warn;
            error_log syslog:server=127.0.0.1:8984 warn;
        }
        location /error {
            limit_req zone=one;
            limit_req_log_level error;
            error_log syslog:server=127.0.0.1:8984;
        }
        location /low {
            error_log syslog:server=127.0.0.1:8984 warn;
            error_log syslog:server=127.0.0.1:8984;
        }
        location /dup {
            error_log syslog:server=127.0.0.1:8984;
            error_log syslog:server=127.0.0.1:8984;
        }
        location /high {
            error_log syslog:server=127.0.0.1:8984 emerg;
            error_log syslog:server=127.0.0.1:8984;
        }
    }
}

