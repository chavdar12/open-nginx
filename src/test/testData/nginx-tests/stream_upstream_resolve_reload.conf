


daemon off;

events {
}

stream {
    

    upstream u {
        zone z 1m;
        server example.net:8081 resolve;
    }

    upstream u2 {
        zone z 1m;
        server 127.0.0.203:8081 max_fails=0;
        server example.net:8081 resolve max_fails=0;
    }

    # lower the retry timeout after empty reply
    resolver 127.0.0.1:8980 valid=1s;
    # retry query shortly after DNS is started
    resolver_timeout 1s;

    log_format test $upstream_addr;

    server {
        listen 127.0.0.1:8082;
        proxy_pass u;
        proxy_connect_timeout 50ms;
        access_log /tmp/nginx-test/cc.log test;
    }

    server {
        listen 127.0.0.1:8083;
        proxy_pass u2;
        proxy_connect_timeout 50ms;
        access_log /tmp/nginx-test/cc2.log test;
    }
}

