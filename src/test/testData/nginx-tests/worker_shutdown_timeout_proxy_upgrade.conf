


daemon off;
worker_shutdown_timeout 10ms;

events {
}

http {
    

    server {
        listen       127.0.0.1:8080;
        server_name  localhost;

        location / {
            proxy_pass    http://127.0.0.1:8081;
            proxy_http_version 1.1;
            proxy_set_header Upgrade foo;
            proxy_set_header Connection Upgrade;
        }
    }
}

