


daemon off;

events {
}

http {
    

    server {
        listen       127.0.0.1:8080;
        server_name  localhost;

        msie_refresh on;

        location / {
            return 301 text;
        }

        location /space {
            return 301 "space ";
        }

        location /error_page {
            return 301;
            error_page 301 text;
        }

        location /off {
            msie_refresh off;
            return 301 text;
        }

        location /ssi {
            ssi on;
        }
    }
}

