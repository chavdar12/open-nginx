


daemon off;

events {
}

http {
    

    perl_set $pem '
        sub {
            my $r = shift;
            local $/;
            my $sni = $r->variable("ssl_server_name");
            open my $fh, "<", "/tmp/nginx-test/$sni.crt";
            my $content = <$fh>;
            close $fh;
            return $content;
        }
    ';

    server {
        listen       127.0.0.1:8443 ssl;
        server_name  localhost;

        ssl_certificate data:$pem;
        ssl_certificate_key data:$pem;
    }
}

