


daemon off;

events {
}

http {
    

    server {
        listen       127.0.0.1:8080;
        server_name  localhost;

        userid         on;
        userid_name    test;
        userid_path    /0123456789;
        userid_domain  test.domain;

        location / {
            userid_flags samesite=strict;

            location /many {
                userid_flags httponly samesite=none secure;
            }

            location /off {
                userid_flags off;
            }
        }

        location /lax {
            userid_flags samesite=lax;
        }

        location /unset { }
    }
}

