


daemon off;

events {
}

http {
    

    server {
        listen       127.0.0.1:8080;
        server_name  localhost;

        location /store- {
            proxy_pass http://127.0.0.1:8080/;
            proxy_store on;
        }
        location /store-string- {
            proxy_pass http://127.0.0.1:8080/;
            proxy_store /tmp/nginx-test$uri;
        }
        location /ssi.html {
            ssi on;
        }
        location /index-big.html {
            limit_rate  200k;
        }
    }
}

