


daemon off;

events {
}

http {
    

    resolver 127.0.0.1:8980;

    upstream u {
        zone z 1m;
        server example.net:8080 resolve;
    }

    upstream u1 {
        zone z 1m;
        server example.net:8080 resolve;
        resolver 127.0.0.1:8981;
    }

    upstream u2 {
        zone z 1m;
        server example.net:8080 resolve;
        resolver 127.0.0.1:8982;
        resolver_timeout 200s; # for coverage
    }

    server {
        listen       127.0.0.1:8080;
        server_name  localhost;

        location / {
            proxy_pass http://$args/t;
            proxy_connect_timeout 50ms;
            add_header X-IP $upstream_addr;
            error_page 502 504 redirect;
        }

    }
}

