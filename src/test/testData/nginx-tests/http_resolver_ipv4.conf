


daemon off;

events {
}

http {
    

    server {
        listen       127.0.0.1:8080;
        server_name  localhost;

        add_header X-Addr $upstream_addr always;
        proxy_next_upstream http_403;

        location / {
            proxy_pass  http://$arg_h:8081/;
            resolver  127.0.0.1:8980 ipv4=on ipv6=on;
        }

        location /ipv4 {
            proxy_pass  http://$arg_h:8081/;
            resolver  127.0.0.1:8980 ipv4=on ipv6=off;
        }

        location /ipv6 {
            proxy_pass  http://$arg_h:8081/;
            resolver  127.0.0.1:8980 ipv4=off ipv6=on;
        }
    }

    server {
        listen       127.0.0.1:8081;
        listen       [::1]:8081;
        server_name  localhost;

        location / {
            # return 403;
        }
    }
}

