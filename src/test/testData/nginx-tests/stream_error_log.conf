


error_log /tmp/nginx-test/e_glob.log info;
error_log /tmp/nginx-test/e_glob2.log info;
error_log syslog:server=127.0.0.1:8983 info;

daemon off;

events {
}

stream {
    

    upstream u {
        server 127.0.0.1:8983 down;
    }

    server {
        listen      127.0.0.1:8080;
        proxy_pass  u;

        error_log /tmp/nginx-test/e_debug.log debug;
        error_log /tmp/nginx-test/e_info.log info;
        error_log /tmp/nginx-test/e_emerg.log emerg;
        error_log stderr info;
    }

    server {
        listen      127.0.0.1:8082;
        proxy_pass  127.0.0.1:8081;

        error_log /tmp/nginx-test/e_stream.log info;
        error_log syslog:server=127.0.0.1:8985 info;
        error_log syslog:server=127.0.0.1:8984 info;
    }
}

