


daemon off;

events {
}

http {
    

    map $args $x {
        var      foo:$y;
        var2     $y:foo;
        default  foo:$y;
    }

    map $args $y {
        default  bar;
        same     baz;
    }

    server {
        listen       127.0.0.1:8080;
        server_name  localhost;

        location / {
            add_header X-Foo $x;
            return 204;
        }
    }
}

