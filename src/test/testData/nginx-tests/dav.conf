


daemon off;

events {
}

http {
    

    server {
        listen       127.0.0.1:8080;
        server_name  localhost;

        absolute_redirect off;

        location / {
            dav_methods PUT DELETE MKCOL COPY MOVE;
        }

        location /i/ {
            alias /tmp/nginx-test/;
            dav_methods PUT DELETE MKCOL COPY MOVE;
        }

        location /full/ {
            dav_methods PUT DELETE MKCOL COPY MOVE;
            create_full_put_path on;
        }

        location /min3/ {
            dav_methods PUT DELETE MKCOL COPY MOVE;
            min_delete_depth 3;
        }

        location /min0/ {
            dav_methods PUT DELETE MKCOL COPY MOVE;
            min_delete_depth 0;
        }

        location /access/ {
            dav_methods PUT DELETE MKCOL COPY MOVE;
            dav_access user:rw group:r all:r;
        }
    }
}

