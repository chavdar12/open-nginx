


daemon off;

events {
}

http {
    

    geo $geo {
        ::1/128         loopback;
        2001:0db8::/32  test;
        ::/0            world;
    }

    geo $geo_delete {
        ::1/128         loopback;
        2001:0db8::/32  test;
        ::/0            world;
        delete          ::1/128;
    }

    geo $geo_proxy {
        ranges;
        proxy                ::1;
        default              default;
        192.0.2.1-192.0.2.1  test;
    }

    geo $arg_ip $geo_arg {
        default       default;
        ::1/128       loopback;
        192.0.2.0/24  test;
    }

    server {
        listen       127.0.0.1:8080;
        server_name  localhost;

        location / {
            proxy_pass http://[::1]:8080/;
        }
    }

    server {
        listen       [::1]:8080;
        server_name  localhost;

        location / {
            add_header X-Geo  $geo;
            add_header X-Del  $geo_delete;
            add_header X-XFF  $geo_proxy;
            add_header X-Arg  $geo_arg;
        }

        location /addr {
            add_header X-IP   $remote_addr;
        }
    }
}

