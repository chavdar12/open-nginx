


daemon off;

events {
}

stream {
    

    map 0 $map_var {
        default "original";
    }

    server {
        listen  127.0.0.1:8082;
        return  $map_var:$set_var;

        set $set_var $map_var;
        set $map_var "new";
    }

    server {
        listen  127.0.0.1:8083;
        return  $set_var;
    }
}

