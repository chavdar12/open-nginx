


daemon off;

events {
}

http {
    

    upstream u {
        server 127.0.0.1:8081;
    }

    server {
        listen       127.0.0.1:8080;
        server_name  localhost;

        location / {
            scgi_pass 127.0.0.1:8081;
            scgi_param SCGI 1;
            scgi_param REQUEST_URI $request_uri;
            scgi_param HTTP_X_BLAH "blah";
        }

        location /var {
            scgi_pass $arg_b;
            scgi_param SCGI 1;
            scgi_param REQUEST_URI $request_uri;
        }

    }
}

