


daemon off;

events {
}

http {
    

    upstream u {
        server 127.0.0.1:8081;
    }

    server {
        listen       127.0.0.1:8080;
        server_name  localhost;

        location / {
            fastcgi_pass unix:/tmp/nginx-test/unix.sock;
            fastcgi_param REQUEST_URI $request_uri;
        }

        location /var {
            fastcgi_pass $arg_b;
            fastcgi_param REQUEST_URI $request_uri;
        }
    }
}

