


daemon off;

events {
}

http {
    

    upstream u {
        server 127.0.0.1:8081;
        keepalive 1;
    }

    server {
        listen       127.0.0.1:8080;
        listen       127.0.0.1:8980 quic;
        server_name  localhost;

        ssl_certificate_key localhost.key;
        ssl_certificate localhost.crt;

        http2 on;
        early_hints 1;

        location / {
            grpc_pass grpc://127.0.0.1:8081;
        }

        location /KeepAlive {
            grpc_pass u;
        }
    }
}

