


error_log /tmp/nginx-test/e_glob.log info;
error_log /tmp/nginx-test/e_glob2.log info;
error_log syslog:server=127.0.0.1:8981 info;

daemon off;

events {
}

mail {
    proxy_timeout  15s;
    auth_http  http://127.0.0.1:8080/mail/auth;

    server {
        listen     127.0.0.1:8143;
        protocol   imap;

        error_log /tmp/nginx-test/e_debug.log debug;
        error_log /tmp/nginx-test/e_info.log info;
        error_log syslog:server=127.0.0.1:8982 info;
        error_log stderr info;
    }

    server {
        listen     127.0.0.1:8145;
        protocol   imap;

        error_log syslog:server=127.0.0.1:8983 info;
    }
}

http {
    

    server {
        listen       127.0.0.1:8080;
        server_name  localhost;

        location = /mail/auth {
            add_header Auth-Status OK;
            add_header Auth-Server 127.0.0.1;
            add_header Auth-Port 8144;
            add_header Auth-Wait 1;
            return 204;
        }
    }
}

