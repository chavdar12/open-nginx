


daemon off;

events {
}

stream {
    

    limit_conn_zone  $binary_remote_addr  zone=zone:1m;
    limit_conn_zone  $binary_remote_addr  zone=zone2:1m;

    proxy_responses  1;
    proxy_timeout    1s;

    server {
        listen           127.0.0.1:8981 udp;
        proxy_pass       127.0.0.1:8980;

        limit_conn       zone 1;
        proxy_responses  2;
    }

    server {
        listen           127.0.0.1:8982 udp;
        proxy_pass       127.0.0.1:8980;
        limit_conn       zone2 1;
    }

    server {
        listen           127.0.0.1:8983 udp;
        proxy_pass       127.0.0.1:8980;
        limit_conn       zone 5;
    }

    server {
        listen           127.0.0.1:8984 udp;
        proxy_pass       127.0.0.1:8981;
        limit_conn       zone2 1;
    }

    server {
        listen           127.0.0.1:8985 udp;
        proxy_pass       127.0.0.1:8981;
        limit_conn       zone 1;
    }
}

