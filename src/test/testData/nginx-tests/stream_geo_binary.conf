


daemon off;

events {
}

stream {
    

    geo $geo_base_create {
        ranges;
        include  base.conf;
    }

    geo $geo_base_include {
        ranges;
        include  base.conf;
    }

    server {
        listen  127.0.0.1:8080;
        return  "geo_base_create:$geo_base_create
                 geo_base_include:$geo_base_include";
    }
}

