


daemon off;

events {
}

http {
    

    server {
        listen       127.0.0.1:8080 proxy_protocol;
        server_name  localhost;

        http2 on;

        location /pp {
            set_real_ip_from 127.0.0.1/32;
            real_ip_header proxy_protocol;
            alias /tmp/nginx-test/t.html;
            add_header X-PP $remote_addr;
        }
    }
}

