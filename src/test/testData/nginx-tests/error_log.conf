


daemon off;

events {
}

http {
    

    limit_req_zone $binary_remote_addr zone=one:1m rate=1r/m;
    limit_req zone=one;

    server {
        listen       127.0.0.1:8080;
        server_name  localhost;

        location /debug {
            error_log /tmp/nginx-test/e_debug_debug.log debug;
            error_log /tmp/nginx-test/e_debug_info.log info;
            error_log stderr debug;
        }
        location /info {
            limit_req_log_level info;
            error_log /tmp/nginx-test/e_info_debug.log debug;
            error_log /tmp/nginx-test/e_info_info.log info;
            error_log /tmp/nginx-test/e_info_notice.log notice;
            error_log stderr info;
        }
        location /notice {
            limit_req_log_level notice;
            error_log /tmp/nginx-test/e_notice_info.log info;
            error_log /tmp/nginx-test/e_notice_notice.log notice;
            error_log /tmp/nginx-test/e_notice_warn.log warn;
            error_log stderr notice;
        }
        location /warn {
            limit_req_log_level warn;
            error_log /tmp/nginx-test/e_warn_notice.log notice;
            error_log /tmp/nginx-test/e_warn_warn.log warn;
            error_log /tmp/nginx-test/e_warn_error.log error;
            error_log stderr warn;
        }
        location /error {
            error_log /tmp/nginx-test/e_error_warn.log warn;
            error_log /tmp/nginx-test/e_error_error.log;
            error_log /tmp/nginx-test/e_error_alert.log alert;
            error_log stderr;
        }

        location /file_low {
            error_log /tmp/nginx-test/e_multi_low.log warn;
            error_log /tmp/nginx-test/e_multi_low.log;
        }
        location /file_dup {
            error_log /tmp/nginx-test/e_multi.log;
            error_log /tmp/nginx-test/e_multi.log;
        }
        location /file_high {
            error_log /tmp/nginx-test/e_multi_high.log emerg;
            error_log /tmp/nginx-test/e_multi_high.log;
        }

        location /stderr_low {
            error_log stderr warn;
            error_log stderr;
        }
        location /stderr_dup {
            error_log stderr;
            error_log stderr;
        }
        location /stderr_high {
            error_log stderr emerg;
            error_log stderr;
        }
    }
}

