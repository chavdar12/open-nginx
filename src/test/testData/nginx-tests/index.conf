


daemon off;

events {
}

http {
    

    server {
        listen       127.0.0.1:8080;
        server_name  localhost;
        add_header   X-URI $uri;

        location / {
            # index index.html by default
        }

        location /redirect/ {
            index /re.html;
        }

        location /loop/ {
            index /loop/;
        }

        location /no_index/ {
            alias /tmp/nginx-test/;
            index nonexisting.html;
        }

        location /many/ {
            alias /tmp/nginx-test/;
            index nonexisting.html many.html;
        }

        location /var/ {
            alias /tmp/nginx-test/;
            index $server_name.html;
        }

        location /va2/ {
            alias /tmp/nginx-test/;
            # before 1.13.8, the token produced emerg:
            # directive "index" is not terminated by ";"
            index ${server_name}.html;
        }

        location /var_redirect/ {
            index /$server_name.html;
        }

        location /not_found/ {
            error_log /tmp/nginx-test/log_not_found.log;

            location /not_found/off/ {
                error_log /tmp/nginx-test/off.log;
                log_not_found off;
            }
        }
    }
}

