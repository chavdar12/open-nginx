


daemon off;

events {
}

http {
    

    server {
        listen       127.0.0.1:8080;
        server_name  localhost;

        error_page   418 = @named;

        location $arg_a {
            add_header X-Location "a";
            return 204;
        }

        location = /exact {
            add_header X-Location "exact";
            return 204;
        }

        location /prefix {
            add_header X-Location "prefix";
            return 204;
        }

        location ^~ /noregex {
            add_header X-Location "noregex";
            return 204;

            location $arg_b {
                add_header X-Location "noregex b";
                return 204;
            }
        }

        location ~ ^/regex {
            add_header X-Location "regex";
            return 204;

            location $arg_b {
                add_header X-Location "regex b";
                return 204;
            }
        }

        location /nested {
            add_header X-Location "nested";
            return 204;

            location $arg_b {
                add_header X-Location "nested b";
                return 204;
            }
        }

        location = /named {
            return 418;
        }

        location @named {
            add_header X-Location "named";
            return 204;
        }

        location $arg_c {

            if ($arg_c = '2') {
                add_header X-Location "c if";
                return 204;
            }

            add_header X-Location "c";
            return 204;

            location = /c/exact {
                add_header X-Location "c exact";
                return 204;
            }

            location /c/prefix {
                add_header X-Location "c prefix";
                return 204;
            }

            location ~ ^/c/regex {
                add_header X-Location "c regex";
                return 204;
            }

            location $arg_d {
                add_header X-Location "c d";
                return 204;
            }
        }

        location /redirect {
            rewrite ^ /x?a=1? last;
        }
    }
}

