


daemon off;

events {
}

http {
    

    upstream backend {
        server 127.0.0.1:8081;
        keepalive 1;
    }

    server {
        listen       127.0.0.1:8080;
        server_name  localhost;

        proxy_http_version 2;

        location / {
            proxy_pass http://backend;
        }

        location /unbuffered/ {
            proxy_pass http://backend;
            proxy_buffering off;
        }

        location /inmemory/ {
            ssi on;
            rewrite ^ /ssi.html break;
        }

        location /body/ {
            proxy_set_body body;
            proxy_pass http://backend;
        }

        location /nobody/ {
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_pass http://backend;
        }
    }
}

