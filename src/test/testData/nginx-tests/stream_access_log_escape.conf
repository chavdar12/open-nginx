


daemon off;

events {
}

stream {
    

    map $pid $a {
        default '" \ "';
    }
    map $pid $b {
        default "foo";
    }

    log_format json     escape=json     $a$b$upstream_addr;
    log_format default  escape=default  $a$b$upstream_addr;

    server {
        listen       127.0.0.1:8080;
        return       ok;

        access_log /tmp/nginx-test/json.log json;
        access_log /tmp/nginx-test/test.log default;
    }
}

