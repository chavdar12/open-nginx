


daemon off;

events {
}

stream {
    

    proxy_responses      1;
    proxy_timeout        1s;

    upstream u {
        server 127.0.0.1:8984;
        server 127.0.0.1:8985;
    }

    upstream u2 {
        server 127.0.0.1:8986 down;
        server 127.0.0.1:8986;
        server 127.0.0.1:8984;
        server 127.0.0.1:8985;
    }

    upstream u3 {
        server 127.0.0.1:8984;
        server 127.0.0.1:8985 weight=2;
    }

    upstream u4 {
        server 127.0.0.1:8986 down;
        server 127.0.0.1:8984 backup;
    }

    server {
        listen      127.0.0.1:8980 udp;
        proxy_pass  u;
    }

    server {
        listen      127.0.0.1:8981 udp;
        proxy_pass  u2;
    }

    server {
        listen      127.0.0.1:8982 udp;
        proxy_pass  u3;
    }

    server {
        listen      127.0.0.1:8983 udp;
        proxy_pass  u4;
    }
}

