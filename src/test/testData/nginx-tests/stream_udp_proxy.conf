


daemon off;

events {
}

stream {
    

    proxy_timeout        1s;

    server {
        listen           127.0.0.1:8980 udp;
        proxy_pass       127.0.0.1:8981;

        proxy_responses  0;
    }

    server {
        listen           127.0.0.1:8982 udp;
        proxy_pass       127.0.0.1:8981;

        proxy_responses  2;
    }

    server {
        listen           127.0.0.1:8983 udp;
        proxy_pass       127.0.0.1:8981;
    }
}

