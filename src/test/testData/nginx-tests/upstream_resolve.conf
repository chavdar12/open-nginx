


daemon off;

events {
}

http {
    

    upstream u {
        zone z 1m;
        server example.net:8080 resolve max_fails=0;
    }

    # lower the retry timeout after empty reply
    resolver 127.0.0.1:8982 valid=1s;
    # retry query shortly after DNS is started
    resolver_timeout 1s;

    server {
        listen       127.0.0.1:8080;
        listen       [::1]:8080;
        server_name  localhost;

        location / {
            proxy_pass http://u/t;
            proxy_connect_timeout 50ms;
            add_header X-IP $upstream_addr;
            error_page 502 504 redirect;
        }

        location /2 {
            proxy_pass http://u/t;
            add_header X-IP $upstream_addr;
        }

        location /t { }
    }
}

