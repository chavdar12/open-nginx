


daemon off;

events {
}

http {
    

    server {
        listen       unix:/tmp/nginx-test/unix.sock proxy_protocol;
        server_name  localhost;

        add_header X-IP $remote_addr;
        add_header X-PP $proxy_protocol_addr;
        real_ip_header proxy_protocol;

        location / { }
        location /pp {
            set_real_ip_from unix:;
            error_page 404 =200 /t;
        }
    }
}

stream {
    

    server {
        listen      unix:/tmp/nginx-test/unix1.sock proxy_protocol;
        return      $remote_addr:$proxy_protocol_addr;
    }

    server {
        listen      unix:/tmp/nginx-test/unix2.sock proxy_protocol;
        return      $remote_addr:$proxy_protocol_addr;

        set_real_ip_from unix:;
    }

    server {
        listen      127.0.0.1:8080;
        proxy_pass  unix:/tmp/nginx-test/unix.sock;

        proxy_protocol on;
    }

    server {
        listen      127.0.0.1:8081;
        proxy_pass  unix:/tmp/nginx-test/unix1.sock;

        proxy_protocol on;
    }

    server {
        listen      127.0.0.1:8082;
        proxy_pass  unix:/tmp/nginx-test/unix2.sock;

        proxy_protocol on;
    }
}

