


daemon off;

events {
}

http {
    

    map $uri $uri_cached {
        /1/          /1/redirect;
        /1/redirect  uncached;
    }

    map $uri $uri_uncached {
        volatile;

        /2/          /2/redirect;
        /2/redirect  uncached;
    }

    server {
        listen       127.0.0.1:8080;
        server_name  localhost;

        location /1 {
            index $uri_cached;
        }
        location /1/redirect {
            add_header X-URI $uri_cached always;
        }

        location /2 {
            index $uri_uncached;
        }
        location /2/redirect {
            add_header X-URI $uri_uncached always;
        }
    }
}

