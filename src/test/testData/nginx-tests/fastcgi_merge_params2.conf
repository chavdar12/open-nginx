


daemon off;

events {
}

http {
    

    fastcgi_cache_path  /tmp/nginx-test/cache  levels=1:2
                        keys_zone=NAME:1m;

    fastcgi_cache_key   stub;

    # no fastcgi_param at all, cache switched on at server level

    server {
        listen       127.0.0.1:8080;
        server_name  localhost;

        fastcgi_cache  NAME;

        location / {
            fastcgi_pass    127.0.0.1:8081;
        }

        location /no/ {
            fastcgi_pass    127.0.0.1:8081;
            fastcgi_cache   off;
        }
    }
}

