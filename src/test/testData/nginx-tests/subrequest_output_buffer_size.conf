


daemon off;

events {
}

http {
    

    server {
        listen       127.0.0.1:8080;
        server_name  localhost;

        location / {
            proxy_pass http://127.0.0.1:8081;
            subrequest_output_buffer_size 42;
        }

        location /longok {
            proxy_pass http://127.0.0.1:8081/long;
        }

        location /ssi {
            ssi on;
        }
    }

    server {
        listen       127.0.0.1:8081;
        server_name  localhost;

        location / { }
    }
}

