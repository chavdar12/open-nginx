


daemon off;

events {
}

http {
    

    server {
        listen       127.0.0.1:8080;
        listen       127.0.0.1:8182-8183;
        listen       [::1]:8182-8183;
        server_name  localhost;

        location / {
            proxy_pass  http://$arg_b/t;
        }

        location /t {
            return  200  $server_addr:$server_port;
        }
    }

    # catch out of range

    server {
        listen       127.0.0.1:8181;
        listen       127.0.0.1:8184;
        listen       [::1]:8181;
        listen       [::1]:8184;
        server_name  localhost;
    }
}

