


daemon off;

events {
}

stream {
    

    resolver 127.0.0.1:8980;

    upstream u {
        zone z 1m;
        server example.net:8080 resolve;
    }

    upstream u1 {
        zone z 1m;
        server example.net:8080 resolve;
        resolver 127.0.0.1:8981;
    }

    upstream u2 {
        zone z 1m;
        server example.net:8080 resolve;
        resolver 127.0.0.1:8982;
        resolver_timeout 200s; # for coverage
    }

    log_format test $upstream_addr;

    proxy_connect_timeout 50ms;

    server {
        listen       127.0.0.1:8081;
        proxy_pass   u;

        access_log /tmp/nginx-test/access.log test;
    }

    server {
        listen       127.0.0.1:8082;
        proxy_pass   u1;

        access_log /tmp/nginx-test/access1.log test;
    }

    server {
        listen       127.0.0.1:8083;
        proxy_pass   u2;

        access_log /tmp/nginx-test/access2.log test;
    }
}

