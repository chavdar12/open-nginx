


daemon off;

events {
}

http {
    

    log_format time_iso8601  '$uri $time_iso8601';
    log_format time_local    '$uri $time_local';
    log_format msec          '$uri $msec';
    log_format request       '$uri $status $request_length $request_time';
    log_format bytes         '$uri $bytes_sent $body_bytes_sent';
    log_format pipe          '$uri $pipe';

    server {
        listen       127.0.0.1:8080;
        server_name  localhost;

        location /iso8601 {
            access_log /tmp/nginx-test/iso8601.log time_iso8601;
            return 200;
        }

        location /local {
            access_log /tmp/nginx-test/local.log time_local;
            return 200;
        }

        location /msec {
            access_log /tmp/nginx-test/msec.log msec;
            return 200;
        }

        location /request {
            access_log /tmp/nginx-test/request.log request;
            return 200;
        }

        location /bytes {
           access_log /tmp/nginx-test/bytes.log bytes;
           return 200 OK;
        }

        location /pipe {
            access_log /tmp/nginx-test/pipe.log pipe;
            return 200;
        }
    }
}

