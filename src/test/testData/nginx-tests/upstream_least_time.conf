


daemon off;

events {
}

http {
    

    # separate upstreams for sane statistics

    upstream u {
        least_time last_byte;
        server 127.0.0.1:8081 fail_timeout=0;
        server 127.0.0.1:8082;
    }
    upstream u0 {
        least_time last_byte;
        server 127.0.0.1:8081;
        server 127.0.0.1:8082;
    }
    upstream u3 {
        least_time last_byte;
        server 127.0.0.1:8081;
        server 127.0.0.1:8082;
    }
    upstream u4 {
        least_time last_byte;
        server 127.0.0.1:8081;
        server 127.0.0.1:8082;
    }
    upstream u5 {
        least_time last_byte;
        server 127.0.0.1:8081;
        server 127.0.0.1:8082;
    }
    upstream u6 {
        least_time last_byte;
        server 127.0.0.1:8081;
        server 127.0.0.1:8082;
    }
    upstream u7 {
        least_time last_byte inflight;
        server 127.0.0.1:8081;
        server 127.0.0.1:8082;
    }

    upstream u8 {
        least_time header;
        server 127.0.0.1:8081;
        server 127.0.0.1:8082;
    }
    upstream u9 {
        least_time header;
        server 127.0.0.1:8081;
        server 127.0.0.1:8082;
    }
    upstream u10 {
        least_time header;
        server 127.0.0.1:8081;
        server 127.0.0.1:8082;
    }

    map $server_port:$arg_r $map_rate {
        8081:1    500;
        8082:2    500;
        ~both              500;

        default            0;
    }

    server {
        listen       127.0.0.1:8080;
        server_name  localhost;

        location /u/ {
            proxy_pass http://u/;
        }
        location /u0/ {
            proxy_pass http://u0/;
        }
        location /u3/ {
            proxy_pass http://u3/;
        }
        location /u4/ {
            proxy_pass http://u4/;
        }
        location /u5/ {
            proxy_pass http://u5/;
        }
        location /u6/ {
            proxy_pass http://u6/;
        }
        location /u7/ {
            proxy_pass http://u7/;
        }
        location /u8/ {
            proxy_pass http://u8/;
        }
        location /u9/ {
            proxy_pass http://u9/;
        }
        location /u10/ {
            proxy_pass http://u10/;
        }
    }

    server {
        listen       127.0.0.1:8081;
        listen       127.0.0.1:8082;
        server_name  localhost;

        keepalive_requests 1;

        location / {
            add_header X-Port $server_port;
            set $limit_rate $map_rate;
        }

        location /headers {
            add_header X-Port $server_port;
            proxy_set_header X-Port $server_port;
            set $limit_rate $map_rate;
            proxy_pass http://127.0.0.1:8083;
        }
    }
}

