


daemon off;

events {
}

http {
    

    ssl_certificate_key localhost.key;
    ssl_certificate localhost.crt;

    add_header X-Session $ssl_session_reused always;

    server {
        listen       127.0.0.1:8943 quic;
        server_name  localhost;
    }

    server {
        listen       127.0.0.1:8944 quic;
        server_name  localhost;

        ssl_session_cache shared:SSL:1m;
        ssl_session_tickets on;
    }

    server {
        listen       127.0.0.1:8945 quic;
        server_name  localhost;

        ssl_session_cache shared:SSL:1m;
        ssl_session_tickets off;
    }

    server {
        listen       127.0.0.1:8946 quic;
        server_name  localhost;

        ssl_session_cache builtin;
        ssl_session_tickets off;
    }

    server {
        listen       127.0.0.1:8947 quic;
        server_name  localhost;

        ssl_session_cache builtin:1000;
        ssl_session_tickets off;
    }

    server {
        listen       127.0.0.1:8948 quic;
        server_name  localhost;

        ssl_session_cache none;
        ssl_session_tickets off;
    }

    server {
        listen       127.0.0.1:8949 quic;
        server_name  localhost;

        ssl_session_cache off;
        ssl_session_tickets off;
    }
}

