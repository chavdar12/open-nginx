


daemon off;

events {
}

http {
    

    server {
        listen       127.0.0.1:8080;
        server_name  localhost;

        location / {
            if ($arg_c) {
                return 204;
            }
        }

        location /sp {
            if ( $arg_c ) {
                return 204;
            }
        }

        location /eq {
            if ($arg_c = 1) {
                return 204;
            }
        }

        location /not {
            if ($arg_c != 2) {
                return 204;
            }
        }

        location /pos {
            if ($arg_c ~ foo) {
                return 204;
            }
        }

        location /cpos {
            if ($arg_c ~* foo) {
                return 204;
            }
        }

        location /neg {
            if ($arg_c !~ foo) {
                return 204;
            }
        }

        location /cneg {
            if ($arg_c !~* foo) {
                return 204;
            }
        }

        location /plain {
            if (-f /tmp/nginx-test/$arg_c) {
                return 204;
            }
        }

        location /dir {
            if (-d /tmp/nginx-test/$arg_c) {
                return 204;
            }
        }

        location /exist {
            if (-e /tmp/nginx-test/$arg_c) {
                return 204;
            }
        }

        location /exec {
            if (-x /tmp/nginx-test/$arg_c) {
                return 204;
            }
        }

        location /not_plain {
            if (!-f /tmp/nginx-test/$arg_c) {
                return 204;
            }
        }

        location /not_dir {
            if (!-d /tmp/nginx-test/$arg_c) {
                return 204;
            }
        }

        location /not_exist {
            if (!-e /tmp/nginx-test/$arg_c) {
                return 204;
            }
        }

        location /not_exec {
            if (!-x /tmp/nginx-test/$arg_c) {
                return 204;
            }
        }
    }
}

