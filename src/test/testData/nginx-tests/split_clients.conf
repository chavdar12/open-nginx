


daemon off;

events {
}

http {
    

    split_clients $connection $variant {
        51.2%  ".one";
        10%    ".two";
        *      ".three";
    }

    server {
        listen       127.0.0.1:8080;
        server_name  localhost;

        location / {
            index index${variant}.html;
        }
    }
}

