


daemon off;

events {
    debug_connection ::1;
}

http {
    

    error_log /tmp/nginx-test/debug1.log alert;
    error_log /tmp/nginx-test/debug2.log alert;

    server {
        listen       127.0.0.1:8080;
        listen       [::1]:8080;
        server_name  localhost;

        location /debug {
            proxy_pass http://[::1]:8080/;
        }
    }
}

