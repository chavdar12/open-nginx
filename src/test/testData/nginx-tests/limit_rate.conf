


daemon off;

events {
}

http {
    

    log_format test escape=none $uri:$arg_a$arg_xal:$upstream_response_time;

    server {
        listen       127.0.0.1:8080;
        server_name  localhost;

        location / {
            proxy_pass http://127.0.0.1:8081;
            access_log /tmp/nginx-test/test.log test;
        }
    }

    server {
        listen       127.0.0.1:8081;
        server_name  localhost;

        limit_rate 12k;
        limit_rate_after 256;

        location /data {
            add_header X-Accel-Redirect $arg_xar;
            add_header X-Accel-Limit-Rate $arg_xal;
        }

        location /redirect {
            limit_rate 0;
            alias /tmp/nginx-test/data;
        }

        location /var {
            alias /tmp/nginx-test/data;
            limit_rate $arg_l;
            limit_rate_after $arg_a;
        }

        location /proxy/ {
            proxy_pass http://127.0.0.1:8081/;
        }
    }
}

