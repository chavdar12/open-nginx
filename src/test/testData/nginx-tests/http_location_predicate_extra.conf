


daemon off;

events {
}

http {
    

    map $uri $mapped {
        /mapped  1;
    }

    map $uri $volatile {
        volatile;
        /volatile  1;
    }

    server {
        listen       127.0.0.1:8080;
        server_name  localhost;

        location $arg_proxy {
            proxy_pass http://127.0.0.1:8081;
        }

        location $arg_file {
            root /tmp/nginx-test/html;
        }

        location $arg_alias_var {
            alias /tmp/nginx-test/html$uri;
        }

        location $arg_alias_try {
            alias /tmp/nginx-test/html/;
            try_files $uri =404;
        }

        location $arg_alias_nest {
            location /sub/ {
                alias /tmp/nginx-test/html/;
            }
            return 204;
        }

        location $arg_dir {
            location /dir/ {
                proxy_pass http://127.0.0.1:8081;
            }
        }

        location /redirect/mapped {
            rewrite ^ /mapped last;
        }

        location /redirect/volatile {
            rewrite ^ /volatile last;
        }

        location $mapped {
            add_header X-Location "mapped";
            return 204;
        }

        location $volatile {
            add_header X-Location "volatile";
            return 204;
        }
    }

    server {
        listen       127.0.0.1:8081;
        server_name  localhost;

        location / {
            add_header X-Location "proxied";
            return 204;
        }
    }
}

