


daemon off;

events {
}

http {
    

    proxy_cache_path   /tmp/nginx-test/cache  levels=1:2
                       keys_zone=NAME:1m;

    server {
        listen       127.0.0.1:8080;
        server_name  localhost;

        proxy_cache        NAME;
        proxy_cache_key    $uri;
        proxy_cache_valid  any 1m;

        proxy_http_version 2;

        add_header X-Cache-Status $upstream_cache_status;
        add_trailer X-Stub "";

        location / {
            proxy_pass http://127.0.0.1:8081;
        }
        location /nobuf {
            proxy_pass http://127.0.0.1:8081/;
            proxy_buffering off;
        }
        location /inmemory.html {
            ssi on;
        }
    }
}

