


daemon off;

events {
}

http {
    

    upstream u {
        server 127.0.0.1:8081;
    }

    resolver 127.0.0.1:8982;

    server {
        listen       127.0.0.1:8080;
        server_name  localhost;

        location / {
            grpc_pass $host:8081;
        }

        location /grpc {
            grpc_pass grpc://$host:8081;
        }

        location /grpcs {
            grpc_pass grpcs://$host:8082;
        }

        location /arg {
            grpc_pass $arg_b;
        }
    }

    server {
        listen       127.0.0.1:8081;
        listen       127.0.0.1:8082 ssl;
        server_name  localhost;

        http2 on;

        ssl_certificate_key localhost.key;
        ssl_certificate localhost.crt;

        location / {
            return 200 $http_host;
        }
    }
}

