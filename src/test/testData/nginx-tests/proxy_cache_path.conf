


daemon off;

events {
}

http {
    

    proxy_cache_path   /tmp/nginx-test/cache1
                       keys_zone=ON:1m      use_temp_path=on;
    proxy_cache_path   /tmp/nginx-test/cache2
                       keys_zone=OFF:1m     use_temp_path=off;
    proxy_cache_path   /tmp/nginx-test/cache4   levels=1:2
                       keys_zone=LEVELS:1m  use_temp_path=off;

    server {
        listen       127.0.0.1:8080;
        server_name  localhost;

        location / {
            proxy_pass    http://127.0.0.1:8081;

            proxy_cache   $arg_c;

            proxy_cache_valid   any      1m;

            add_header X-Cache-Status $upstream_cache_status;
        }
    }

    server {
        listen       127.0.0.1:8081;
        server_name  localhost;

        location / {
        }
    }
}

