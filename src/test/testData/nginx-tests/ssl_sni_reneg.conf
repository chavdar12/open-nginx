


daemon off;

events {
}

http {
    

    ssl_certificate_key localhost.key;
    ssl_certificate localhost.crt;
    ssl_protocols TLSv1 TLSv1.1 TLSv1.2;

    server {
        listen       127.0.0.1:8443 ssl;
        listen       127.0.0.1:8444 ssl;
        server_name  localhost;

        location / { }
    }

    server {
        listen       127.0.0.1:8444 ssl;
        server_name  localhost2;

        location / { }
    }
}

