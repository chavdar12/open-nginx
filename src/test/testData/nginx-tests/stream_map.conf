


daemon off;

events {
}

stream {
    

    map $server_port $x {
        8080             literal;
        default                   default;
        ~(8082)          $1;
        ~(?P<ncap>8083)  $ncap;
    }

    server {
        listen  127.0.0.1:8080;
        listen  127.0.0.1:8081;
        listen  127.0.0.1:8082;
        listen  127.0.0.1:8083;
        return  $x;
    }

    server {
        listen  127.0.0.1:8084;
        return  $x:${x};
    }
}

