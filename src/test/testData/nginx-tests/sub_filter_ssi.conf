


daemon off;

events {
}

http {
    

    types {
        text/html html;
        text/xml  xml;
    }

    server {
        listen       127.0.0.1:8080;
        server_name  localhost;

        location / {
            ssi on;
            sub_filter notfoo bar;
        }

        location /xslt {
            ssi on;
            sub_filter_types *;
            sub_filter root>foo bar;
            xslt_stylesheet test.xslt;
        }
    }
}

