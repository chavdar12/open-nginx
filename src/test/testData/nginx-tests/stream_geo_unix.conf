


daemon off;

events {
}

stream {
    

    geo $geo {
        default                  default;
        255.255.255.255          none;
    }

    geo $remote_addr $geora {
        default                  default;
        255.255.255.255          none;
    }

    geo $geor {
        ranges;
        0.0.0.0-255.255.255.254  test;
        default                  none;
    }

    geo $remote_addr $georra {
        ranges;
        0.0.0.0-255.255.255.254  test;
        default                  none;
    }

    server {
        listen      unix:/tmp/nginx-test/unix.sock;
        return      "geo:$geo geora:$geora geor:$geor georra:$georra";
    }

    server {
        listen      127.0.0.1:8080;
        proxy_pass  unix:/tmp/nginx-test/unix.sock;
    }
}

