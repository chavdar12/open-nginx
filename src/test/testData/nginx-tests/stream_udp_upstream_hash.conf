


daemon off;

events {
}

stream {
    

    proxy_responses      1;
    proxy_timeout        1s;

    upstream hash {
        hash $remote_addr;
        server 127.0.0.1:8982;
        server 127.0.0.1:8983;
    }

    upstream cons {
        hash $remote_addr consistent;
        server 127.0.0.1:8982;
        server 127.0.0.1:8983;
    }

    server {
        listen      127.0.0.1:8980 udp;
        proxy_pass  hash;
    }

    server {
        listen      127.0.0.1:8981 udp;
        proxy_pass  cons;
    }
}

