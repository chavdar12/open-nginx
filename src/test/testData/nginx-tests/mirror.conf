


daemon off;

events {
}

http {
    

    log_format test $uri;

    server {
        listen       127.0.0.1:8080;
        server_name  localhost;

        location / {
            mirror /mirror;

            location /off {
                mirror off;
            }
        }

        location /many {
            mirror /mirror/1;
            mirror /mirror/2;
        }

        location /mirror {
            log_subrequest on;
            access_log test$args.log test;
        }
    }
}

