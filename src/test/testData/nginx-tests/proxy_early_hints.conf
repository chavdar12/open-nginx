


daemon off;

events {
}

http {
    

    server {
        listen       127.0.0.1:8080;
        listen       127.0.0.1:8980 quic;
        server_name  localhost;

        ssl_certificate_key localhost.key;
        ssl_certificate localhost.crt;

        http2 on;
        early_hints 1;

        location / {
            proxy_pass http://127.0.0.1:8081;
            proxy_http_version 1.1;

            location /off/ {
                proxy_pass http://127.0.0.1:8081/;
                early_hints 0;
            }
        }
    }
}

