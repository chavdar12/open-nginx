


daemon off;

events {
}

http {
    

    http2 on;

    server {
        listen       127.0.0.1:8080;
        server_name  localhost;

        large_client_header_buffers 4 32k;

        location / { }

        location /merge/ {
            proxy_pass http://127.0.0.1:8081/;
            add_header X-Upstream-Priority $upstream_http_priority;
        }

        location /subrequest/ {
            mirror /mirror;
            alias /tmp/nginx-test/;
        }

        location /mirror {
            internal;
            proxy_pass http://127.0.0.1:8081/urgency;
        }
    }

    server {
        listen       127.0.0.1:8082 sndbuf=4k;
        server_name  localhost;

        location / { }

        location /trailers/ {
            alias /tmp/nginx-test/;
            output_buffers 1 1m;
            add_trailer X-Trailer foo;
        }
    }

    server {
        listen       127.0.0.1:8081;
        server_name  localhost;

        location /urgency {
            add_header Priority "u=0";
            return 200 "SEE-THIS";
        }

        location /incremental {
            add_header Priority "i";
            return 200 "SEE-THIS";
        }

        location /malformed {
            add_header Priority "u=0, @bad";
            return 200 "SEE-THIS";
        }
    }
}

