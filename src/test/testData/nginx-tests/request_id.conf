


daemon off;

events {
}

http {
    

    log_format id $request_id;

    server {
        listen       127.0.0.1:8080;
        server_name  localhost;

        add_header X-Request-Id $request_id;
        add_header X-blah blah;

        location / {
            ssi on;
        }
        location /body {
            return 200 $request_id;
        }
        location /log {
            access_log /tmp/nginx-test/id.log id;
            return 200;
        }
    }
}

