


daemon off;

events {
}

http {
    

    server {
        listen       127.0.0.1:8080;
        server_name  localhost;

        location = /t1.html {
            auth_request /auth;
            auth_request_set $username $upstream_http_x_username;
            add_header X-Set-Username $username;
        }

        location = /t2.html {
            auth_request /auth;
            auth_request_set $username $upstream_http_x_username;
            error_page 404 = /fallback;
        }
        location = /fallback {
            add_header X-Set-Username $username;
            return 204;
        }

        location = /t3.html {
            auth_request /auth;
            auth_request_set $username $upstream_http_x_username;
            error_page 404 = @fallback;
        }
        location @fallback {
            add_header X-Set-Username $username;
            return 204;
        }

        location = /t4.html {
            auth_request /auth;
            auth_request_set $username $upstream_http_x_username;
            error_page 404 = /t4-fallback.html;
        }
        location = /t4-fallback.html {
            auth_request /auth2;
            auth_request_set $username $upstream_http_x_username;
            add_header X-Set-Username $username;
        }

        location = /t5.html {
            auth_request /auth;
            auth_request_set $args "setargs";
            proxy_pass http://127.0.0.1:8081/t5.html;
        }

        location = /t6.html {
            add_header X-Unset-Username "x${username}x";
            return 204;
        }

        location = /auth {
            proxy_pass http://127.0.0.1:8081;
        }
        location = /auth2 {
            proxy_pass http://127.0.0.1:8081;
        }
    }

    server {
        listen       127.0.0.1:8081;
        server_name  localhost;

        location = /auth {
            add_header X-Username "username";
            return 204;
        }

        location = /auth2 {
            add_header X-Username "username2";
            return 204;
        }

        location = /t5.html {
            add_header X-Args $args;
            return 204;
        }
    }
}

