


daemon off;

events {
}

http {
    

    geo $localhost {
        default localhost;
    }

    geo $pass {
        default pass;
    }

    add_header X-SSL $ssl_server_name;

    server {
        listen       127.0.0.1:8080 ssl;
        server_name  default;

        ssl_certificate localhost.crt;
        ssl_certificate_key store:file:/tmp/nginx-test/localhost.key;
    }

    server {
        listen       127.0.0.1:8080 ssl;
        server_name  variable;

        ssl_certificate localhost.crt;
        ssl_certificate_key store:file:/tmp/nginx-test/$localhost.key;
    }

    server {
        listen       127.0.0.1:8080 ssl;
        server_name  pass;

        ssl_certificate pass.crt;
        ssl_certificate_key store:file:/tmp/nginx-test/pass.key;

        ssl_password_file password;
    }

    server {
        listen       127.0.0.1:8080 ssl;
        server_name  variable-pass;

        ssl_certificate pass.crt;
        ssl_certificate_key store:file:/tmp/nginx-test/$pass.key;

        ssl_password_file password;
    }

    server {
        listen       127.0.0.1:8080 ssl;
        server_name  variable-no-pass;

        ssl_certificate pass.crt;
        ssl_certificate_key store:file:/tmp/nginx-test/$pass.key;
    }
}

