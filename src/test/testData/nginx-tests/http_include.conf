


daemon off;

events {
}

http {
    

    upstream u {
        include ups.conf;
    }

    server {
        listen       127.0.0.1:8080;
        server_name  localhost;

        if ($arg_s) {
            include sif.conf;
        }

        location / {
            if ($arg_l) {
                include lif.conf;
            }
        }

        location /lmt {
            limit_except GET {
                include lmt.conf;
            }
        }

        location /proxy {
            add_header X-IP $upstream_addr always;
            proxy_pass http://u/backend;
        }

        location /backend { }
    }
}

