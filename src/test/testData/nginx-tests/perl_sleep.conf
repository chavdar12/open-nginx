


daemon off;

events {
}

http {
    

    server {
        listen       127.0.0.1:8080;
        server_name  localhost;

        location / {
            ssi on;
            sendfile_max_chunk 100;
            postpone_output 0;
        }

        location /sleep {
            perl 'sub {
                my $r = shift;

                $r->sleep(100, sub {
                    my $r = shift;
                    $r->send_http_header;
                    $r->print("it works");
                    return OK;
                });

                return OK;
            }';
        }
    }
}

