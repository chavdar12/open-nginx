


daemon off;

events {
}

http {
    

    proxy_cache_path   /tmp/nginx-test/cache  max_size=0  keys_zone=NAME:1m
                       manager_sleep=5  manager_files=2  manager_threshold=10;

    proxy_cache_path   /tmp/nginx-test/water  keys_zone=NAM2:16k
                       manager_sleep=5;

    server {
        listen       127.0.0.1:8080;
        server_name  localhost;

        location / {
            proxy_pass    http://127.0.0.1:8081;
            proxy_cache   NAME;

            proxy_cache_valid   any   1m;
        }

        location /water/ {
            proxy_pass    http://127.0.0.1:8081/t.html;
            proxy_cache   NAM2;

            proxy_cache_valid   any   1m;
        }
    }

    server {
        listen       127.0.0.1:8081;
        server_name  localhost;

        location / { }
    }
}

