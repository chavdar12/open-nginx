


daemon off;

events {
}

http {
    

    server {
        listen       127.0.0.1:8080;
        server_name  localhost;

        early_hints 1;

        location / {
            proxy_pass http://127.0.0.1:8081;
            proxy_http_version 2;

            location /off/ {
                proxy_pass http://127.0.0.1:8081/;
                early_hints 0;
            }
        }
    }
}

