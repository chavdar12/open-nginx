


daemon off;

events {
}

http {
    

    server {
        listen       127.0.0.1:8080;
        server_name  localhost;

        location /short {
            resolver    127.0.0.1:8981;
            resolver_timeout 2s;

            proxy_pass  http://$host:8080/t;
        }

        location /long {
            resolver    127.0.0.1:8981;
            resolver_timeout 5s;

            proxy_pass  http://$host:8080/t;
        }

        location / { }
    }
}

