


daemon off;

events {
}

http {
    

    server {
        listen       127.0.0.1:8080;
        server_name  localhost;

        set $variable $content_length;

        location / {
            uwsgi_pass 127.0.0.1:8081;
            uwsgi_param CONTENT_LENGTH $content_length if_not_empty;
        }
    }
}

