


daemon off;

events {
}

http {
    

    server {
        listen       127.0.0.1:8080;
        server_name  localhost;

        sub_filter_types *;
        sub_filter foo bar;

        location / {
        }

        location /once {
            return 200 $arg_b;
        }

        location /many {
            sub_filter_once off;
            return 200 $arg_b;
        }

        location /complex {
            sub_filter abac _replaced;
            return 200 $arg_b;
        }

        location /complex2 {
            sub_filter ababX _replaced;
            return 200 $arg_b;
        }

        location /complex3 {
            sub_filter aab _replaced;
            return 200 $arg_b;
        }

        location /single {
            sub_filter A B;
            return 200 $arg_b;
        }

        location /single/many {
            sub_filter A B;
            sub_filter_once off;
            return 200 $arg_b;
        }

        location /var/string {
            sub_filter X$arg_a _replaced;
            return 200 $arg_b;
        }

        location /var/replacement {
            sub_filter aab '${arg_a}_replaced';
            return 200 $arg_b;
        }

        location /lm {
            sub_filter_last_modified on;
            proxy_pass http://127.0.0.1:8081/;
        }
    }

    server {
        listen       127.0.0.1:8081;
        server_name  localhost;
    }
}

