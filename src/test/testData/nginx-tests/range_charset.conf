


daemon off;

events {
}

http {
    

    charset_map B A {
        58 59; # X -> Y
    }

    proxy_cache_path   /tmp/nginx-test/cache  levels=1:2
                       keys_zone=NAME:1m;

    server {
        listen       127.0.0.1:8080;
        server_name  localhost;

        location / {
            proxy_pass    http://127.0.0.1:8081;
            proxy_cache   NAME;
            proxy_cache_valid 200 1m;
        }
    }

    server {
        listen       127.0.0.1:8081;
        server_name  localhost;

        charset B;

        location /t2.html {
            add_header X-Accel-Charset A;
        }
    }
}

