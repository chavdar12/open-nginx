


daemon off;

events {
}

http {
    

    types {
        text/html html;
        text/foo  foo;
    }

    charset_map B A {
        58 59; # X -> Y
    }

    server {
        listen       127.0.0.1:8080;
        server_name  localhost;

        location / {
            charset utf-8;
        }

        location /t3.foo {
            charset utf-8;
            charset_types text/foo;
        }

        location /t4.any {
            charset utf-8;
            charset_types *;
        }

        location /t5.html {
            charset $arg_c;
        }

        location /t.html {
            charset A;
            source_charset B;
        }

        location /proxy/ {
            charset B;
            override_charset on;
            proxy_pass http://127.0.0.1:8080/;
        }
    }
}

