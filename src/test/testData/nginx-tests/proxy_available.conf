


daemon off;

events {
}

http {
    

    server {
        listen       127.0.0.1:8080;
        server_name  localhost;

        location /buffered {
            proxy_pass http://127.0.0.1:8081;
            proxy_buffer_size 512;
        }

        location /unbuffered {
            proxy_pass http://127.0.0.1:8082;
            proxy_buffer_size 512;
            proxy_buffering off;
        }
    }
}

