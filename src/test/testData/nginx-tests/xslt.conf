


daemon off;

events {
}

http {
    

    server {
        listen       127.0.0.1:8080;
        server_name  localhost;

        default_type text/xml;

        location /x1 {
            xslt_stylesheet /tmp/nginx-test/test.xslt;
        }
        location /x2 {
            xslt_stylesheet /tmp/nginx-test/test.xslt
                            param1='value1':param2=/root param3='value%33';
        }
        location /x3 {
            xml_entities /tmp/nginx-test/entities.dtd;
            xslt_stylesheet /tmp/nginx-test/test.xslt;
        }
        location /x4 {
            xslt_stylesheet /tmp/nginx-test/first.xslt;
            xslt_stylesheet /tmp/nginx-test/test.xslt;
        }
        location /x5 {
            xslt_stylesheet /tmp/nginx-test/test.xslt
                            param1='$server_name';
        }
    }
}

