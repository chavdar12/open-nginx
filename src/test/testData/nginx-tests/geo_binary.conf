


daemon off;

events {
}

http {
    

    geo $geo_base_create {
        ranges;
        include  base.conf;
    }

    geo $geo_base_include {
        ranges;
        include  base.conf;
    }

    server {
        listen       127.0.0.1:8080;
        server_name  localhost;

        location / {
            add_header X-IP   $remote_addr;
            add_header X-GBc  $geo_base_create;
            add_header X-GBi  $geo_base_include;
        }
    }
}

