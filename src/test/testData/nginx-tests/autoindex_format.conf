


daemon off;

events {
}

http {
    

    server {
        listen       127.0.0.1:8080;
        server_name  localhost;

        autoindex on;

        location /xml/ {
            autoindex_format xml;
            alias /tmp/nginx-test/;
        }
        location /json/ {
            autoindex_format json;
            alias /tmp/nginx-test/;
        }
        location /jsonp/ {
            autoindex_format jsonp;
            alias /tmp/nginx-test/;
        }
    }
}

