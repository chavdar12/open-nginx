


daemon off;

events {
}

http {
    

    server {
        listen       127.0.0.1:8080;
        server_name  localhost;

        location /preserve {
            proxy_pass http://127.0.0.1:8080/get-method;
        }

        location /const {
            proxy_pass http://127.0.0.1:8080/get-method;
            proxy_method POST;
        }

        location /var {
            proxy_pass http://127.0.0.1:8080/get-method;
            proxy_method $arg_method;
        }

        location /parent {
            proxy_method POST;
            location /parent/child {
                proxy_pass http://127.0.0.1:8080/get-method;
            }
        }

        location /get-method {
            return 200 "request_method=$request_method";
        }
    }
}

