


daemon off;

events {
}

stream {
    

    proxy_timeout  2100ms;

    log_format status $status;

    server {
        listen           127.0.0.1:8980 udp;
        proxy_pass       127.0.0.1:8990;

        proxy_requests   0;
    }

    server {
        listen           127.0.0.1:8981 udp;
        proxy_pass       127.0.0.1:8990;

        proxy_requests   1;
    }

    server {
        listen           127.0.0.1:8982 udp;
        proxy_pass       127.0.0.1:8990;

        proxy_requests   2;
    }

    server {
        listen           127.0.0.1:8983 udp;
        proxy_pass       127.0.0.1:8990;
    }

    server {
        listen           127.0.0.1:8984 udp;
        proxy_pass       127.0.0.1:8991;

        proxy_requests   2;
        access_log       /tmp/nginx-test/s.log status;
    }

    server {
        listen           127.0.0.1:8985 udp;
        proxy_pass       127.0.0.1:8991;

        proxy_requests   2;
        proxy_responses  2;
        access_log       /tmp/nginx-test/s2.log status;
    }
}

