


daemon off;

events {
}

stream {
    

    map $pid $a {
        default '" \ "';
    }
    map $pid $b {
        default "foo";
    }

    log_format none     escape=none     $a$b$upstream_addr;

    server {
        listen       127.0.0.1:8080;
        return       ok;

        access_log /tmp/nginx-test/none.log none;
    }
}

