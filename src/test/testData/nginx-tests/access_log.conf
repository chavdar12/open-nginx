


daemon off;

events {
}

http {
    

    log_format test "$uri:$status";
    log_format long "long line $uri:$status";
    log_format addr "$remote_addr:$remote_port:$server_addr:$server_port";
    log_format binary $binary_remote_addr;

    log_format default  escape=default  $uri$arg_b$arg_c;
    log_format none     escape=none     $uri$arg_b$arg_c;
    log_format json     escape=json     $uri$arg_b$arg_c;

    server {
        listen       127.0.0.1:8080;
        server_name  localhost;

        location /combined {
            access_log /tmp/nginx-test/combined.log;
            return 200 OK;

            location /combined/off {
                access_log off;
                return 200 OK;
            }
        }

        location /filtered {
            access_log /tmp/nginx-test/filtered.log test
                       if=$arg_logme;
            return 200 OK;
        }

        location /filtered/complex {
            access_log /tmp/nginx-test/complex.log test
                       if=$arg_logme$arg_logmetoo;
            return 200 OK;
        }

        location /filtered/noreuse {
            access_log /tmp/nginx-test/noreuse.log test buffer=16k
                       if=$arg_a;
            access_log /tmp/nginx-test/noreuse.log test buffer=16k
                       if=$arg_b;
            return 200 OK;
        }

        location /compressed {
            access_log /tmp/nginx-test/compressed.log test
                       gzip buffer=1m flush=100ms;
            return 200 OK;
        }

        location /multi {
            access_log /tmp/nginx-test/multi1.log test;
            access_log /tmp/nginx-test/multi2.log test;
            access_log /tmp/nginx-test/long.log long;
            return 200 OK;
        }

        location /varlog {
            access_log /tmp/nginx-test/varlog_${arg_logname} test;
            return 200 OK;
        }

        location /cache {
            open_log_file_cache max=3 inactive=20s valid=1m min_uses=2;
            access_log /tmp/nginx-test/dir/cache_${arg_logname} test;
            return 200 OK;
        }

        location /addr {
            access_log /tmp/nginx-test/addr.log addr;
        }

        location /binary {
            access_log /tmp/nginx-test/binary.log binary;
        }

        location /escape {
            access_log /tmp/nginx-test/test.log default;
            access_log /tmp/nginx-test/none.log none;
            access_log /tmp/nginx-test/json.log json;
        }
    }
}

