


daemon         off;

events {
}

http {
    

    server {
        listen       127.0.0.1:8080;
        server_name  localhost;

        location / {
            add_header X-Location root;
            return 204;
        }

        location /directory/ {
            add_header X-Location directory;
            return 204;
        }

        location /direct~1 {
        }

        location = /file {
            add_header X-Location file;
            return 204;
        }
    }
}

