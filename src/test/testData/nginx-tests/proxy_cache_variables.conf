


daemon off;

events {
}

http {
    

    proxy_cache_path   /tmp/nginx-test/cache1  levels=1:2
                       keys_zone=NAME1:1m;
    proxy_cache_path   /tmp/nginx-test/cache2  levels=1:2
                       keys_zone=NAME2:1m;

    server {
        listen       127.0.0.1:8080;
        server_name  localhost;

        location / {
            proxy_pass    http://127.0.0.1:8081;

            proxy_cache   $arg_c;

            proxy_cache_valid   any      1m;

            add_header X-Cache-Status $upstream_cache_status;
        }
    }

    server {
        listen       127.0.0.1:8081;
        server_name  localhost;

        location / {
        }
    }
}

