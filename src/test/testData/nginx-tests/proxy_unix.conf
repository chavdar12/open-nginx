


daemon off;

events {
}

http {
    

    upstream u {
        server unix:/tmp/nginx-test/unix.sock;
    }

    server {
        listen       127.0.0.1:8080;
        server_name  localhost;

        location / {
            proxy_pass http://unix:/tmp/nginx-test/unix.sock;
            proxy_read_timeout 1s;
            proxy_connect_timeout 2s;
        }

        location /var {
            proxy_pass http://$arg_b;
            proxy_read_timeout 1s;
        }

        location /u {
            proxy_pass http://u;
            proxy_read_timeout 1s;
        }
    }
}

