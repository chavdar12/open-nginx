


daemon off;

events {
}

http {
    

    proxy_cache_path   /tmp/nginx-test/cache  keys_zone=NAME:1m;
    proxy_cache_path   /tmp/nginx-test/cach3  keys_zone=NAME3:1m;
    proxy_cache_key    $uri$is_args$args$slice_range;

    fastcgi_cache_path   /tmp/nginx-test/cache2  keys_zone=NAME2:1m;
    fastcgi_cache_key    $uri$is_args$args$slice_range;

    map $http_range $range {
        ~bytes=(.+) $1;
    }

    server {
        listen       127.0.0.1:8080;
        server_name  localhost;

        location / { }

        location /proxy/ {
            slice 2;

            proxy_pass    http://127.0.0.1:8081/;

            proxy_set_header   Range  $slice_range;
        }

        location /cache/ {
            slice 2;

            proxy_pass    http://127.0.0.1:8081/;

            proxy_cache   NAME;

            proxy_set_header   Range  $slice_range;

            proxy_cache_valid   200 206  1h;

            add_header X-Cache-Status $upstream_cache_status;
        }

        location /fastcgi {
            slice 2;

            fastcgi_pass    127.0.0.1:8082;

            fastcgi_cache   NAME2;

            fastcgi_param   Range $slice_range;

            fastcgi_cache_valid   200 206  1h;

            fastcgi_force_ranges  on;

            add_header X-Cache-Status $upstream_cache_status;
        }

        location /cache-redirect {
            error_page 404 = @fallback;
        }

        location @fallback {
            slice 2;

            proxy_pass    http://127.0.0.1:8081/t$is_args$args;

            proxy_cache   NAME3;

            proxy_set_header   Range  $slice_range;

            proxy_cache_valid   200 206  1h;
        }
    }

    server {
        listen       127.0.0.1:8081;
        server_name  localhost;

        add_header Accept-Ranges bytes;

        location / {
            if ($http_range = "") {
                set $limit_rate 100;
            }
        }

        location /bad_status {
            add_header Content-Range "bytes 0-1/100";

            if ($http_range = "bytes=2-3") {
                return 200;
            }

            return 206 fo;
        }

        location /bad_etag {
            add_header Content-Range "bytes $range/100";
            add_header ETag $http_range;
            return 206 fo;
        }

        location /bad_crange {
            add_header Content-Range "bytes";
            return 206 fo;
        }

        location /bad_length {
            add_header Content-Range "bytes 0-1/*";
            return 206 fo;
        }

        location /bad_range1 {
            add_header Content-Range "bytes 0-2/100";
            return 206 foo;
        }

        location /bad_range2 {
            add_header Content-Range "bytes 1-2/100";
            return 206 fo;
        }
    }
}

