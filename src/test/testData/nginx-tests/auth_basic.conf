


daemon off;

events {
}

http {
    

    server {
        listen       127.0.0.1:8080;
        server_name  localhost;

        location / {
            auth_basic           "closed site";
            auth_basic_user_file /tmp/nginx-test/htpasswd;

            location /inner {
                auth_basic off;
                alias /tmp/nginx-test/;
            }

            location /var {
                # prepended with conf_prefix
                auth_basic_user_file $arg_f;
                alias /tmp/nginx-test/;
            }
        }
    }
}

