


daemon off;

events {
}

stream {
    

    upstream u {
        server unix:/tmp/nginx-test/unix.sock;
    }

    server {
        listen       127.0.0.1:8080;
        proxy_pass   unix:/tmp/nginx-test/unix.sock;
    }

    server {
        listen       127.0.0.1:8081;
        proxy_pass   u;
    }
}

