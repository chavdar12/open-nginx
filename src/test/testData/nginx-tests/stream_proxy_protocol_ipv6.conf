


daemon off;

events {
}

stream {
    

    server {
        listen          127.0.0.1:8080;
        proxy_pass      [::1]:8080;
    }

    server {
        listen          127.0.0.1:8081;
        proxy_pass      [::1]:8081;
    }

    server {
        listen          [::1]:8080;
        proxy_pass      127.0.0.1:8082;
        proxy_protocol  on;
    }

    server {
        listen          [::1]:8081;
        proxy_pass      127.0.0.1:8082;
    }
}

