


daemon off;

events {
}

http {
    

    server {
        listen       127.0.0.1:8080;
        server_name  localhost;

        sub_filter_types *;

        location /var/replacement {
            sub_filter_once off;
            sub_filter '${arg_a}' '${arg_a}+';
            sub_filter '${arg_b}' '${arg_b}-';
            return 200 $arg_c;
        }

        location /var/replacement2 {
            sub_filter_once off;
            sub_filter '${arg_a}A${arg_b}'  +;
            sub_filter '${arg_c}AA${arg_d}' -;
            return 200 $arg_e;
        }
    }

}

