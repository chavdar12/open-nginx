


daemon off;

events {
}

http {
    

    server {
        listen       127.0.0.1:8080;
        listen       8186-8187;
        server_name  localhost;

        location / {
            proxy_pass  http://$arg_b/t;
        }

        location /t {
            return  200  $server_addr:$server_port;
        }
    }

    # catch out of range

    server {
        listen       127.0.0.1:8185;
        listen       127.0.0.1:8188;
        server_name  localhost;
    }
}

