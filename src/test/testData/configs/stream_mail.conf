# TCP/UDP proxying and mail proxy: contexts other than http
load_module modules/ngx_stream_module.so;
load_module modules/ngx_mail_module.so;

events {
    worker_connections 4096;
}

stream {
    upstream dns {
        hash $remote_addr consistent;
        server 10.0.0.1:53;
        server 10.0.0.2:53;
    }

    map $ssl_preread_server_name $backend {
        default       10.0.1.1:443;
        a.example.com 10.0.1.2:443;
    }

    log_format basic '$remote_addr [$time_local] $protocol $status $bytes_sent $session_time';

    server {
        listen 53 udp reuseport;
        proxy_pass dns;
        proxy_timeout 1s;
        proxy_responses 1;
    }

    server {
        listen 443;
        ssl_preread on;
        proxy_pass $backend;
        access_log /var/log/nginx/stream.log basic;
    }

    server {
        listen 3306;
        proxy_pass 10.0.0.5:3306;
        proxy_connect_timeout 1s;
        proxy_protocol on;
    }
}

mail {
    server_name mail.example.com;
    auth_http 127.0.0.1:9000/auth;
    proxy_pass_error_message on;

    server {
        listen 143;
        protocol imap;
    }

    server {
        listen 25;
        protocol smtp;
        smtp_auth login plain;
    }
}
