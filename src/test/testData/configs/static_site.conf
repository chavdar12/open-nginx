# Typical static site: main/events/http contexts, all location modifiers
user www-data;
worker_processes auto;
worker_rlimit_nofile 65535;
error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 1024;
    multi_accept on;
    use epoll;
}

http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;
    charset utf-8;

    gzip on;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_vary on;

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name example.com www.example.com;
        root /var/www/example;
        index index.html index.htm;

        location = /favicon.ico { access_log off; log_not_found off; }
        location ^~ /static/ { expires 30d; add_header Cache-Control "public"; }
        location ~* \.(?:css|js|png|jpe?g|gif|svg|woff2?)$ { expires 7d; }
        location ~ /\. { deny all; }
        location / { try_files $uri $uri/ @fallback; }
        location @fallback { rewrite ^ /index.html last; }

        error_page 404 /404.html;
        error_page 500 502 503 504 /50x.html;
        location = /50x.html { internal; }
    }
}
