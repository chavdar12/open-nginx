# URL checks for proxy_pass / grpc_pass / uwsgi_pass: valid forms stay clean, mistakes carry the expected error
events {}

http {
    upstream app { server 127.0.0.1:8080; }

    server {
        listen 80;

        # valid
        location /a/ { proxy_pass http://app; }
        location /b/ { proxy_pass https://app/api/; }
        location /c/ { proxy_pass http://127.0.0.1:8080/; }
        location /d/ { proxy_pass http://[::1]:8080; }
        location /e/ { proxy_pass http://unix:/run/app.sock:/; }
        location /f/ { set $up app; proxy_pass http://$up/x; }
        location /g/ { proxy_pass $scheme://app; }
        location ~ \.php$ { proxy_pass http://app; }
        location @named { proxy_pass http://app; }
        location /grpc { grpc_pass grpc://127.0.0.1:9000; }
        location /grpc2 { grpc_pass 127.0.0.1:9000; }
        location /uwsgi { uwsgi_pass uwsgi://127.0.0.1:3031; }

        # mistakes
        location /m1/ { proxy_pass <error descr="Invalid URL prefix in 'app', expected http:// or https://">app</error>; }
        location /m2/ { proxy_pass <error descr="Invalid URL scheme 'ftp://', expected http:// or https://">ftp://app</error>; }
        location /m3/ { proxy_pass <error descr="Missing host in URL 'http:///x'">http:///x</error>; }
        location /m4/ { proxy_pass <error descr="Invalid port '99999' in URL 'http://app:99999'">http://app:99999</error>; }
        location /m5/ { proxy_pass <error descr="Invalid port 'abc' in URL 'http://app:abc/'">http://app:abc/</error>; }
        location ~ ^/m6/ { proxy_pass <error descr="proxy_pass cannot have URI part in location given by regular expression, or inside named location, or inside \"if\" statement, or inside \"limit_except\" block">http://app/x/</error>; }
        location @m7 { proxy_pass <error descr="proxy_pass cannot have URI part in location given by regular expression, or inside named location, or inside \"if\" statement, or inside \"limit_except\" block">http://app/</error>; }
        location /m8/ {
            if ($arg_x) { proxy_pass <error descr="proxy_pass cannot have URI part in location given by regular expression, or inside named location, or inside \"if\" statement, or inside \"limit_except\" block">http://app/x</error>; }
            limit_except GET { proxy_pass <error descr="proxy_pass cannot have URI part in location given by regular expression, or inside named location, or inside \"if\" statement, or inside \"limit_except\" block">http://app/y</error>; }
        }
        location /m9 { grpc_pass <error descr="Invalid URL scheme 'http://', expected grpc:// or grpcs://">http://127.0.0.1:9000</error>; }
    }
}

stream {
    server {
        listen 3306;
        proxy_pass 10.0.0.5:3306;
    }
}
