# Every check the plugin does, with the problem it must report
worker_processes auto;
<warning descr="Unknown directive 'acme_shared_dict'">acme_shared_dict</warning> cache 10m;

events {
    <error descr="'listen' is not allowed in 'events'">listen</error> 80;
}

http {
    <error descr="'worker_connections' is not allowed in 'http'">worker_connections</error> 10;
    <error descr="'gzip' takes 1 argument(s), got 2">gzip</error> on off;
    <error descr="'gzip' directive is duplicate">gzip</error> <error descr="Invalid value 'yes' for 'gzip', expected on | off">yes</error>;
    <error descr="'gzip_types' takes at least 1 argument(s), got 0">gzip_types</error>;
    <error descr="'map' takes 2 argument(s), got 1">map</error> <warning descr="Unknown variable '$a': not built in and not declared by set, map, geo... in this project">$a</warning> {
        anything goes here;
    }

    server {
        listen 80;
        <error descr="'http' is not allowed in 'server'">http</error> {}
        location / {
            root /var/www<error descr="';' or '{' expected"> </error>}
        location /x {
            proxy_pass http://127.0.0.1;
            <error descr="'ssl_verify_client' is not allowed in 'location'">ssl_verify_client</error> on;
        }
    }
}
