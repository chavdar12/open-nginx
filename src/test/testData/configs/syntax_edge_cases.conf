# Lexer edge cases: quoting, escapes, glued variables, # and quotes inside words
events {}

http {
    server {
        listen 80;
        location /q {
            add_header X-Double "say \"hi\"";
            add_header X-Single 'it\'s';
            add_header X-Braces "{ not a block }";
            add_header X-Hash "#notacomment";
            return 200 foo#bar;
        }
        location /v {
            set $base /srv;
            set $path ${base}_suffix;
            set $p2 $base$path;
            set $q param1='$path':x;
            root $base/htdocs;
            return 200 "${host}abc $1 ${base}";
        }
        location /multi {
            log_not_found
                off;   # arguments may span lines
            # comment between directives
            access_log off; # trailing comment
        }
        location /empty {}
        location /nested {
            location /nested/deep {
                location /nested/deep/er { return 204; }
            }
        }
        location /case { gzip ON; }
    }
}
