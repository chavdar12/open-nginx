# Blocks whose contents are key/value pairs, not directives
events {}

http {
    types {
        text/html  html htm;
        application/json json;
    }

    map $uri $redirect_to {
        hostnames;
        default        "";
        ~^/old/(.*)$   /new/$1;
        /exact         /target;
        include        /etc/nginx/redirects.map;
    }

    geo $country {
        default        ZZ;
        127.0.0.1      LOCAL;
        192.168.1.0/24 LAN;
    }

    split_clients "${remote_addr}AAA" $variant {
        0.5%  .one;
        2.0%  .two;
        *     "";
    }

    charset_map koi8-r utf-8 {
        C0 D18E;
        C1 D0B0;
    }

    server {
        listen 80;
        location / {
            if ($redirect_to) {
                return 301 $redirect_to;
            }
            return 200 "$country $variant";
        }
    }
}
